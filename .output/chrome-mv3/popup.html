<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>提示词优化器</title>
<style>
body{padding:16px;min-width:340px;font-family:-apple-system,sans-serif;font-size:13px;color:#1e293b;margin:0}
h3{margin:0 0 12px;font-size:15px}
label{display:block;margin-top:10px;margin-bottom:4px;font-size:12px;color:#475569;font-weight:600}
select,input{width:100%;padding:6px 8px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box}
.checkbox-row{display:flex;align-items:center;gap:6px;margin-top:12px}
.checkbox-row input{width:auto}
hr{margin:16px 0;border:none;border-top:1px solid #e2e8f0}
.hint{margin-top:12px;font-size:11px;color:#94a3b8}
.status{margin-top:8px;font-size:12px;min-height:18px}
.status.ok{color:#16a34a}
.status.err{color:#dc2626}
</style>
  <script type="module" crossorigin src="/chunks/popup-BsPm7yBB.js"></script>
</head>
<body>
<h3>提示词优化器设置</h3>
<div class="checkbox-row">
  <input type="checkbox" id="enabled">
  <label for="enabled" style="margin:0;font-weight:normal">启用插件</label>
</div>
<hr>
<label for="provider">AI 提供商</label>
<select id="provider">
  <option value="ollama">Ollama（本地）</option>
  <option value="anthropic">Anthropic / Z.ai</option>
  <option value="openai">OpenAI</option>
  <option value="deepseek">DeepSeek</option>
</select>
<label for="baseUrl">Base URL</label>
<input id="baseUrl" type="text" placeholder="https://api.z.ai/api/anthropic">
<label for="apiKey">API Key</label>
<input id="apiKey" type="password" placeholder="仅本地存储">
<label for="model">模型</label>
<input id="model" type="text" placeholder="glm-4.7-flash">
<p class="hint">API Key 仅保存在浏览器本地，不会同步到其他设备。</p>
<div id="status" class="status"></div>
<script>
(function(){
  var PREF_KEY = 'user_preferences';
  var PRESETS = {
    ollama:    { baseUrl: 'http://localhost:11434/v1',          model: 'deepseek-r1:7b' },
    anthropic: { baseUrl: 'https://api.z.ai/api/anthropic',     model: 'glm-4.7-flash' },
    openai:    { baseUrl: 'https://api.openai.com/v1',          model: 'gpt-4o' },
    deepseek:  { baseUrl: 'https://api.deepseek.com/v1',        model: 'deepseek-chat' }
  };
  function $(id){ return document.getElementById(id); }
  function showStatus(msg, ok){
    var el = $('status');
    el.textContent = msg;
    el.className = 'status ' + (ok ? 'ok' : 'err');
    setTimeout(function(){ el.textContent = ''; el.className = 'status'; }, 2000);
  }
  function getPrefs(){
    return new Promise(function(resolve){
      chrome.storage.local.get(PREF_KEY, function(r){ resolve(r[PREF_KEY] || {}); });
    });
  }
  function setPrefs(patch){
    return getPrefs().then(function(cur){
      var next = Object.assign({}, cur, patch);
      return new Promise(function(resolve){
        chrome.storage.local.set({ [PREF_KEY]: next }, function(){ resolve(next); });
      });
    });
  }
  function saveProvider(){
    var provider = {
      providerId: $('provider').value,
      baseUrl: $('baseUrl').value,
      apiKey: $('apiKey').value,
      model: $('model').value
    };
    return setPrefs({ provider: provider }).then(function(){
      showStatus('✅ 已保存', true);
    });
  }
  function init(){
    getPrefs().then(function(prefs){
      var p = prefs.provider || { providerId:'anthropic', baseUrl:'https://api.z.ai/api/anthropic', apiKey:'', model:'glm-4.7-flash' };
      $('enabled').checked = prefs.enabled !== false;
      $('provider').value = p.providerId || 'anthropic';
      $('baseUrl').value = p.baseUrl || '';
      $('apiKey').value = p.apiKey || '';
      $('model').value = p.model || '';
      $('enabled').addEventListener('change', function(e){ setPrefs({ enabled: e.target.checked }); });
      $('provider').addEventListener('change', function(e){
        var preset = PRESETS[e.target.value];
        if (preset){ $('baseUrl').value = preset.baseUrl; $('model').value = preset.model; }
        saveProvider();
      });
      $('baseUrl').addEventListener('change', saveProvider);
      $('apiKey').addEventListener('change', saveProvider);
      $('model').addEventListener('change', saveProvider);
    }).catch(function(e){ console.error('[popup] init failed:', e); });
  }
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
</body>
</html>
