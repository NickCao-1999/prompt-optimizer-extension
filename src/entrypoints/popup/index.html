<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>提示词优化器</title>
<style>
body{padding:16px;min-width:360px;font-family:-apple-system,sans-serif;font-size:13px;color:#1e293b;margin:0}
h3{margin:0 0 12px;font-size:15px}
label{display:block;margin-top:10px;margin-bottom:4px;font-size:12px;color:#475569;font-weight:600}
select,input{width:100%;padding:6px 8px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box}
.checkbox-row{display:flex;align-items:center;gap:6px;margin-top:12px}
.checkbox-row input{width:auto}
hr{margin:16px 0;border:none;border-top:1px solid #e2e8f0}
.hint{margin-top:12px;font-size:11px;color:#94a3b8}
.actions{margin-top:16px;display:flex;gap:8px}
button{flex:1;padding:8px;font-size:13px;border-radius:6px;cursor:pointer;border:none}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-secondary{background:#fff;color:#334155;border:1px solid #cbd5e1}
.btn-secondary:hover{background:#f8fafc}
.status{margin-top:10px;font-size:12px;min-height:18px;padding:6px;border-radius:4px}
.status.ok{color:#16a34a;background:#f0fdf4}
.status.err{color:#dc2626;background:#fef2f2}
</style>
</head>
<body>
<h3>提示词优化器设置</h3>
<div class="checkbox-row">
  <input type="checkbox" id="enabled">
  <label for="enabled" style="margin:0;font-weight:normal">启用插件</label>
</div>
<hr>
<label for="provider">AI 提供商</label>
<select id="provider">
  <option value="ollama">Ollama（本地）</option>
  <option value="anthropic">Anthropic / Z.ai</option>
  <option value="openai">OpenAI</option>
  <option value="deepseek">DeepSeek</option>
</select>
<label for="baseUrl">Base URL</label>
<input id="baseUrl" type="text">
<label for="apiKey">API Key</label>
<input id="apiKey" type="password">
<label for="model">模型</label>
<input id="model" type="text">
<p class="hint">API Key 仅保存在浏览器本地。</p>
<div class="actions">
  <button class="btn-primary" id="saveBtn">保存配置</button>
  <button class="btn-secondary" id="testBtn">测试连接</button>
</div>
<div id="status" class="status"></div>
<script src="./popup.js"></script>
</body>
</html>
